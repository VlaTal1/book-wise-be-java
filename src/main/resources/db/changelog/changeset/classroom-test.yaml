databaseChangeLog:
  - changeSet:
      id: create-sequence-classroom-test
      author: VlaTal
      changes:
        - createSequence:
            sequenceName: CLASSROOM_TEST_SEQ_ID
      rollback:
        - dropSequence:
            sequenceName: CLASSROOM_TEST_SEQ_ID
  - changeSet:
      id: create-table-classroom-test
      author: VlaTal
      changes:
        - createTable:
            tableName: CLASSROOM_TEST
            columns:
              - column:
                  name: ID
                  type: BIGINT
                  defaultValueSequenceNext: CLASSROOM_TEST_SEQ_ID
                  constraints:
                    primaryKey: true
              - column:
                  name: CLASSROOM_ID
                  type: BIGINT
                  constraints:
                    foreignKeyName: FK_CLASSROOM_TEST_CLASSROOM
                    references: CLASSROOM(ID)
                    nullable: false
              - column:
                  name: BOOK_ID
                  type: BIGINT
                  constraints:
                    foreignKeyName: FK_CLASSROOM_TEST_BOOK
                    references: BOOK(ID)
                    nullable: false
              - column:
                  name: START_PAGE
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: END_PAGE
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: QUESTIONS_AMOUNT
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: DUE_TO
                  type: TIMESTAMP
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
      rollback:
        - dropTable:
            tableName: CLASSROOM_TEST
  - changeSet:
      id: add-classroom-test-to-test
      author: VlaTal
      changes:
        - addColumn:
            tableName: TEST
            columns:
              - column:
                  name: CLASSROOM_TEST_ID
                  type: BIGINT
                  constraints:
                    foreignKeyName: FK_TEST_CLASSROOM_TEST
                    references: CLASSROOM_TEST(ID)
                    nullable: true
