databaseChangeLog:
  - changeSet:
      id: add-generation-status-to-test
      author: VlaTal
      changes:
        - addColumn:
            tableName: TEST
            columns:
              - column:
                  name: GENERATION_STATUS
                  type: VARCHAR(20)
                  defaultValue: READY
                  constraints:
                    nullable: false
        # Тести без питань, створені до появи статусу, генерацію вже не
        # отримають (відповідь Python-сервісу втрачено) — позначаємо як помилку.
        - sql:
            sql: UPDATE TEST SET GENERATION_STATUS = 'FAILED' WHERE NOT EXISTS (SELECT 1 FROM QUESTION q WHERE q.TEST_ID = TEST.ID)
